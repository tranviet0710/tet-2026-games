<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#991B1B"/>
      <stop offset="100%" style="stop-color:#7F1D1D"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative patterns -->
  <circle cx="100" cy="100" r="150" fill="#B91C1C" opacity="0.3"/>
  <circle cx="1100" cy="530" r="200" fill="#B91C1C" opacity="0.3"/>
  
  <!-- Left lantern -->
  <g transform="translate(80, 50)">
    <ellipse cx="60" cy="80" rx="40" ry="50" fill="#FCD34D"/>
    <ellipse cx="60" cy="80" rx="35" ry="45" fill="#F59E0B"/>
    <rect x="50" y="20" width="20" height="15" fill="#92400E"/>
    <line x1="60" y1="0" x2="60" y2="20" stroke="#92400E" stroke-width="3"/>
    <rect x="45" y="125" width="30" height="8" fill="#92400E"/>
    <line x1="50" y1="133" x2="50" y2="160" stroke="#DC2626" stroke-width="2"/>
    <line x1="60" y1="133" x2="60" y2="170" stroke="#DC2626" stroke-width="2"/>
    <line x1="70" y1="133" x2="70" y2="160" stroke="#DC2626" stroke-width="2"/>
  </g>
  
  <!-- Right lantern -->
  <g transform="translate(1020, 50)">
    <ellipse cx="60" cy="80" rx="40" ry="50" fill="#FCD34D"/>
    <ellipse cx="60" cy="80" rx="35" ry="45" fill="#F59E0B"/>
    <rect x="50" y="20" width="20" height="15" fill="#92400E"/>
    <line x1="60" y1="0" x2="60" y2="20" stroke="#92400E" stroke-width="3"/>
    <rect x="45" y="125" width="30" height="8" fill="#92400E"/>
    <line x1="50" y1="133" x2="50" y2="160" stroke="#DC2626" stroke-width="2"/>
    <line x1="60" y1="133" x2="60" y2="170" stroke="#DC2626" stroke-width="2"/>
    <line x1="70" y1="133" x2="70" y2="160" stroke="#DC2626" stroke-width="2"/>
  </g>
  
  <!-- Gold coins decoration -->
  <g transform="translate(550, 80)">
    <ellipse cx="50" cy="30" rx="35" ry="20" fill="#FCD34D"/>
    <ellipse cx="50" cy="25" rx="35" ry="20" fill="#F59E0B"/>
    <ellipse cx="50" cy="25" rx="25" ry="12" fill="#FCD34D"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FCD34D" text-anchor="middle" filter="url(#glow)">
    🧧 Tết Game Keeper
  </text>
  
  <!-- Year -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#FBBF24" text-anchor="middle">
    2026
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="32" fill="#FEF3C7" text-anchor="middle">
    Ghi điểm bài Tết • Xì Dách • Tiến Lên • Ba Cây
  </text>
  
  <!-- Bottom decoration -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="40" fill="#FCD34D" text-anchor="middle">
    🏮 Chúc Mừng Năm Mới 🏮
  </text>
  
  <!-- Cherry blossom decorations -->
  <g fill="#FDF2F8" opacity="0.8">
    <circle cx="200" cy="450" r="8"/>
    <circle cx="220" cy="430" r="6"/>
    <circle cx="180" cy="470" r="5"/>
    <circle cx="240" cy="460" r="7"/>
    
    <circle cx="1000" cy="350" r="8"/>
    <circle cx="980" cy="370" r="6"/>
    <circle cx="1020" cy="330" r="5"/>
    <circle cx="960" cy="340" r="7"/>
  </g>
  
  <!-- Corner decorations -->
  <rect x="20" y="20" width="80" height="4" fill="#FCD34D" opacity="0.5"/>
  <rect x="20" y="20" width="4" height="80" fill="#FCD34D" opacity="0.5"/>
  
  <rect x="1100" y="20" width="80" height="4" fill="#FCD34D" opacity="0.5"/>
  <rect x="1176" y="20" width="4" height="80" fill="#FCD34D" opacity="0.5"/>
  
  <rect x="20" y="606" width="80" height="4" fill="#FCD34D" opacity="0.5"/>
  <rect x="20" y="530" width="4" height="80" fill="#FCD34D" opacity="0.5"/>
  
  <rect x="1100" y="606" width="80" height="4" fill="#FCD34D" opacity="0.5"/>
  <rect x="1176" y="530" width="4" height="80" fill="#FCD34D" opacity="0.5"/>
</svg>
